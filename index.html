<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HardBux - Robux</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(40, 255, 0, 0.12), transparent 35%),
        #020402;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .logo-box {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-box h1 {
      font-size: 52px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -3px;
      color: white;
      text-shadow:
        0 0 5px #39ff14,
        0 0 15px #39ff14,
        0 0 35px #39ff14;
    }

    .logo-box h1 span {
      color: #39ff14;
    }

    .logo-box p {
      margin-top: 8px;
      color: #9cff8a;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .card {
      background: rgba(5, 12, 6, 0.95);
      border: 1px solid rgba(57, 255, 20, 0.45);
      border-radius: 22px;
      padding: 28px;
      box-shadow:
        0 0 25px rgba(57, 255, 20, 0.12),
        inset 0 0 30px rgba(57, 255, 20, 0.03);
    }

    .title {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8d9a8d;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #b9c5b9;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      border: 1px solid #263526;
      background: #080d08;
      color: white;
      padding: 0 16px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
      margin-bottom: 22px;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #39ff14;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.18);
    }

    .robux-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .robux-number {
      font-size: 27px;
      font-weight: 900;
      color: #39ff14;
      text-shadow: 0 0 12px rgba(57, 255, 20, 0.5);
    }

    .range {
      width: 100%;
      appearance: none;
      height: 8px;
      border-radius: 10px;
      background: #182118;
      outline: none;
      cursor: pointer;
      margin: 15px 0 8px;
    }

    .range::-webkit-slider-thumb {
      appearance: none;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #39ff14;
      border: 3px solid #061006;
      box-shadow: 0 0 15px #39ff14;
      cursor: pointer;
    }

    .range::-moz-range-thumb {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #39ff14;
      border: 3px solid #061006;
      box-shadow: 0 0 15px #39ff14;
      cursor: pointer;
    }

    .range-info {
      display: flex;
      justify-content: space-between;
      color: #687368;
      font-size: 12px;
      margin-bottom: 25px;
    }

    /* CUPOM */

    .coupon-box {
      margin-bottom: 20px;
    }

    .coupon-row {
      display: flex;
      gap: 10px;
    }

    .coupon-row input {
      flex: 1;
      margin-bottom: 0;
    }

    .coupon-button {
      height: 52px;
      padding: 0 18px;
      border: 1px solid #39ff14;
      border-radius: 12px;
      background: transparent;
      color: #39ff14;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .coupon-button:hover {
      background: #39ff14;
      color: #031003;
    }

    .coupon-message {
      display: none;
      margin-top: 8px;
      font-size: 13px;
    }

    .coupon-success {
      color: #39ff14;
    }

    .coupon-error {
      color: #ff6464;
    }

    .result {
      border-radius: 16px;
      border: 1px solid rgba(57, 255, 20, 0.35);
      background: linear-gradient(
        135deg,
        rgba(57, 255, 20, 0.08),
        rgba(57, 255, 20, 0.02)
      );
      padding: 20px;
      margin-bottom: 20px;
    }

    .result-top {
      color: #8f9c8f;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .result-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .result-robux {
      font-size: 22px;
      font-weight: 800;
    }

    .result-price {
      font-size: 28px;
      font-weight: 900;
      color: #39ff14;
      text-shadow: 0 0 12px rgba(57, 255, 20, 0.45);
      white-space: nowrap;
    }

    .original-price {
      color: #687368;
      font-size: 13px;
      text-decoration: line-through;
      margin-bottom: 4px;
      text-align: right;
    }

    .button {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 13px;
      background: #39ff14;
      color: #031003;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 20px rgba(57, 255, 20, 0.22);
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(57, 255, 20, 0.45);
    }

    .button:active {
      transform: scale(0.98);
    }

    .discord {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #182118;
      color: #7d897d;
      font-size: 13px;
    }

    .discord a {
      text-decoration: none;
    }

    .discord strong {
      color: #39ff14;
      cursor: pointer;
    }

    .warning {
      display: none;
      color: #ff6464;
      font-size: 13px;
      margin-top: -12px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 22px;
      }

      .logo-box h1 {
        font-size: 43px;
      }

      .result-main {
        flex-direction: column;
        align-items: flex-start;
      }

      .result-price {
        font-size: 26px;
      }

      .coupon-row {
        flex-direction: column;
      }

      .coupon-button {
        width: 100%;
      }

      .original-price {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo-box">
      <h1>HARD<span>BUX</span></h1>
      <p>Robux Store</p>
    </div>

    <section class="card">

      <div class="title">
        Comprar Robux
      </div>

      <div class="subtitle">
        Escolha a quantidade de Robux que deseja comprar.
      </div>

      <label for="username">
        Nome de usuário do Roblox
      </label>

      <input
        type="text"
        id="username"
        value=""
        placeholder="Ex: fazin123"
        autocomplete="off"
      >

      <label for="robuxInput">
        Quantidade de Robux
      </label>

      <input
        type="number"
        id="robuxInput"
        min="0"
        max="10000"
        value="0"
        step="1"
        placeholder="Digite a quantidade"
      >

      <div class="robux-header">
        <span>Robux</span>
        <span class="robux-number" id="robuxNumber">0</span>
      </div>

      <input
        type="range"
        id="robuxRange"
        class="range"
        min="0"
        max="10000"
        value="0"
        step="1"
      >

      <div class="range-info">
        <span>0</span>
        <span>5.000</span>
        <span>10.000</span>
      </div>

      <!-- CUPOM -->

      <div class="coupon-box">

        <label for="couponInput">
          🎟️ Cupom de desconto
        </label>

        <div class="coupon-row">

          <input
            type="text"
            id="couponInput"
            placeholder="Digite seu cupom"
            autocomplete="off"
          >

          <button
            type="button"
            class="coupon-button"
            id="couponButton"
          >
            APLICAR
          </button>

        </div>

        <div
          class="coupon-message"
          id="couponMessage"
        ></div>

      </div>

      <div class="result">

        <div class="result-top">
          Resumo da compra
        </div>

        <div class="result-main">

          <div class="result-robux">
            <span id="resultRobux">0</span> Robux
          </div>

          <div>

            <div
              class="original-price"
              id="originalPrice"
            >
              R$ 0,00
            </div>

            <div
              class="result-price"
              id="resultPrice"
            >
              R$ 0,00
            </div>

          </div>

        </div>

      </div>

      <div class="warning" id="warning">
        Digite seu nome de usuário.
      </div>

      <button class="button" id="continueButton">
        CONTINUAR
      </button>

      <div class="discord">
        Precisa de ajuda?
        <a
          href="https://discord.gg/A6ESDTq3yr"
          target="_blank"
          rel="noopener noreferrer"
        >
          <strong>Entre no nosso Discord</strong>
        </a>
      </div>

    </section>

  </main>

  <script>

    const PRICE_PER_1000 = 49.99;

    const COUPON_CODE = "FAZIN";

    const COUPON_DISCOUNT = 0.01;


    const range =
      document.getElementById("robuxRange");

    const robuxInput =
      document.getElementById("robuxInput");

    const robuxNumber =
      document.getElementById("robuxNumber");

    const resultRobux =
      document.getElementById("resultRobux");

    const resultPrice =
      document.getElementById("resultPrice");

    const originalPrice =
      document.getElementById("originalPrice");

    const username =
      document.getElementById("username");

    const warning =
      document.getElementById("warning");

    const continueButton =
      document.getElementById("continueButton");

    const couponInput =
      document.getElementById("couponInput");

    const couponButton =
      document.getElementById("couponButton");

    const couponMessage =
      document.getElementById("couponMessage");


    let couponApplied = false;


    function formatPrice(value) {

      return value.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });

    }


    function getPrices() {

      const robux =
        Number(robuxInput.value) || 0;

      const original =
        (robux / 1000) * PRICE_PER_1000;

      const finalPrice =
        couponApplied
          ? original * (1 - COUPON_DISCOUNT)
          : original;

      return {
        robux,
        original,
        finalPrice
      };

    }


    function updateCalculator(value) {

      let robux = Number(value);

      if (isNaN(robux)) {
        robux = 0;
      }

      if (robux < 0) {
        robux = 0;
      }

      if (robux > 10000) {
        robux = 10000;
      }

      robux = Math.floor(robux);

      range.value = robux;
      robuxInput.value = robux;

      const original =
        (robux / 1000) * PRICE_PER_1000;

      const price =
        couponApplied
          ? original * (1 - COUPON_DISCOUNT)
          : original;

      robuxNumber.textContent =
        robux.toLocaleString("pt-BR");

      resultRobux.textContent =
        robux.toLocaleString("pt-BR");

      originalPrice.textContent =
        formatPrice(original);

      resultPrice.textContent =
        formatPrice(price);

      if (couponApplied) {
        originalPrice.style.display = "block";
      } else {
        originalPrice.style.display = "none";
      }

      const percentage =
        (robux / 10000) * 100;

      range.style.background =
        `linear-gradient(
          to right,
          #39ff14 0%,
          #39ff14 ${percentage}%,
          #182118 ${percentage}%,
          #182118 100%
        )`;
    }


    range.addEventListener(
      "input",
      function() {
        updateCalculator(range.value);
      }
    );


    robuxInput.addEventListener(
      "input",
      function() {

        if (robuxInput.value === "") {
          return;
        }

        updateCalculator(robuxInput.value);

      }
    );


    robuxInput.addEventListener(
      "blur",
      function() {

        if (robuxInput.value === "") {
          updateCalculator(0);
        }

      }
    );


    // APLICAR CUPOM

    couponButton.addEventListener(
      "click",
      function() {

        const coupon =
          couponInput.value
            .trim()
            .toUpperCase();

        if (coupon === COUPON_CODE) {

          couponApplied = true;

          couponMessage.textContent =
            "✅ Cupom FAZIN aplicado! 1% de desconto.";

          couponMessage.className =
            "coupon-message coupon-success";

          couponMessage.style.display =
            "block";

          updateCalculator(
            robuxInput.value
          );

        } else {

          couponApplied = false;

          couponMessage.textContent =
            "❌ Cupom inválido.";

          couponMessage.className =
            "coupon-message coupon-error";

          couponMessage.style.display =
            "block";

          updateCalculator(
            robuxInput.value
          );

        }

      }
    );


    // BOTÃO CONTINUAR

    continueButton.addEventListener(
      "click",
      async function() {

        const user =
          username.value.trim();

        if (!user) {

          warning.style.display =
            "block";

          username.focus();

          return;
        }

        warning.style.display =
          "none";

        const prices =
          getPrices();

        const couponText =
          couponApplied
            ? "FAZIN"
            : "Nenhum";

        const discountText =
          couponApplied
            ? "1%"
            : "0%";

        const orderText =
`🛒 PEDIDO HARDBUX

👤 Usuário: ${user}
🟢 Robux: ${prices.robux.toLocaleString("pt-BR")}
🎟️ Cupom: ${couponText}
💸 Desconto: ${discountText}
💰 Valor original: ${formatPrice(prices.original)}
💰 Valor final: ${formatPrice(prices.finalPrice)}`;

        try {

          await navigator.clipboard.writeText(
            orderText
          );

          alert(
            "✅ Pedido copiado! Agora é só colar no Discord."
          );

        } catch (error) {

          alert(
            "Pedido preparado. Copie e cole no Discord."
          );

        }

        window.location.href =
          "https://discord.gg/8ryRMmvsQC";

      }
    );


    updateCalculator(0);

  </script>

</body>
</html>
